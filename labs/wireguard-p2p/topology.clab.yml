name: wireguard-p2p
topology:
  defaults:
    kind: linux
    image: ghcr.io/hellt/network-multitool
  nodes:
    site-a:
      exec: ["ip addr add 203.0.113.1/24 dev eth1", "apk add --no-cache wireguard-tools"]
    site-b:
      exec: ["ip addr add 203.0.113.2/24 dev eth1", "apk add --no-cache wireguard-tools"]
  links:
    - endpoints: ["site-a:eth1", "site-b:eth1"]
