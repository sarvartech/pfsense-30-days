title: WireGuard site-to-site tunnel
description: "\"Internet\" (203.0.113.0/24) orqali ikki filial orasida WireGuard tunnel qurish: kalitlar, peer, AllowedIPs."
level: O'rta
duration: 45
tags: [WireGuard, VPN, kriptografiya]
nodes:
  - {name: site-a, shell: bash}
  - {name: site-b, shell: bash}
checks:
  - id: a-wg
    title: site-a da wg0 interfeysi 10.99.99.1/30 bilan ko'tarilgan
    node: site-a
    cmd: ip -4 addr show dev wg0
    expect: 'inet 10\.99\.99\.1/30'
  - id: handshake
    title: site-a da peer bilan handshake bo'lgan
    node: site-a
    cmd: wg show wg0 latest-handshakes
    expect: '\s[1-9][0-9]{8,}$'
  - id: ping
    title: tunnel ichida site-a → site-b (10.99.99.2) ping ishlaydi
    node: site-a
    cmd: ping -c 2 -W 1 10.99.99.2
    expect: ' 0% packet loss'
