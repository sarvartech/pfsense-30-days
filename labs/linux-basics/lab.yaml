title: Linux tarmoq asoslari — ikki xost
description: Ikki Linux xostni bitta kabel bilan ulab, IP manzil berish, ping, ARP jadvali va tcpdump bilan trafikni ko'rish.
level: Boshlang'ich
duration: 30
tags: [iproute2, ARP, ICMP, tcpdump]
nodes:
  - {name: host1, shell: bash}
  - {name: host2, shell: bash}
checks:
  - id: h1-ip
    title: host1 eth1 interfeysida 10.0.12.1/24 manzili bor
    node: host1
    cmd: ip -4 addr show dev eth1
    expect: 'inet 10\.0\.12\.1/24'
  - id: h2-ip
    title: host2 eth1 interfeysida 10.0.12.2/24 manzili bor
    node: host2
    cmd: ip -4 addr show dev eth1
    expect: 'inet 10\.0\.12\.2/24'
  - id: ping
    title: host1 dan host2 ga ping ishlaydi
    node: host1
    cmd: ping -c 2 -W 1 10.0.12.2
    expect: ' 0% packet loss'
  - id: arp
    title: host1 ARP jadvalida host2 MAC manzili bor
    node: host1
    cmd: ip neigh show dev eth1
    expect: '10\.0\.12\.2 .*lladdr'
