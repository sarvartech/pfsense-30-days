title: VLAN izolyatsiya — Linux bridge switch
description: Linux VLAN-aware bridge yordamida 802.1Q switch yasab, bir subnetdagi xostlarni VLAN orqali ajratish.
level: Boshlang'ich
duration: 40
tags: [VLAN, 802.1Q, switching, bridge]
nodes:
  - {name: sw1, shell: bash}
  - {name: pc10a, shell: bash}
  - {name: pc10b, shell: bash}
  - {name: pc20, shell: bash}
checks:
  - id: bridge
    title: sw1 da vlan_filtering yoqilgan br0 bridge mavjud
    node: sw1
    cmd: ip -d link show br0
    expect: 'vlan_filtering 1'
  - id: same-vlan
    title: pc10a → pc10b (VLAN 10) ping ishlaydi
    node: pc10a
    cmd: ping -c 2 -W 1 192.168.10.12
    expect: ' 0% packet loss'
  - id: isolated
    title: pc10a → pc20 (VLAN 20) ping ishlaMAYdi (izolyatsiya)
    node: pc10a
    cmd: ping -c 2 -W 1 192.168.10.21 || true
    expect: '100% packet loss'
