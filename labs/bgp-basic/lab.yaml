title: eBGP — ikki avtonom tizim
description: AS65001 va AS65002 orasida eBGP sessiya ko'tarib, mijoz tarmoqlarini e'lon qilish (ISP peering modeli).
level: O'rta
duration: 60
tags: [BGP, eBGP, FRR, ISP]
nodes:
  - {name: r1, shell: vtysh}
  - {name: r2, shell: vtysh}
  - {name: pc1, shell: bash}
  - {name: pc2, shell: bash}
checks:
  - id: session
    title: r1 va r2 orasida BGP sessiya Established
    node: r1
    cmd: vtysh -c "show bgp ipv4 unicast neighbors 172.16.0.2"
    expect: 'BGP state = Established'
  - id: r1-learns
    title: r1 BGP orqali 10.2.0.0/24 ni o'rgangan
    node: r1
    cmd: vtysh -c "show ip route 10.2.0.0/24"
    expect: 'Known via "bgp"'
  - id: r2-learns
    title: r2 BGP orqali 10.1.0.0/24 ni o'rgangan
    node: r2
    cmd: vtysh -c "show ip route 10.1.0.0/24"
    expect: 'Known via "bgp"'
  - id: e2e
    title: pc1 dan pc2 ga ping ishlaydi
    node: pc1
    cmd: ping -c 2 -W 1 10.2.0.10
    expect: ' 0% packet loss'
