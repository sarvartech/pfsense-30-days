# VPS (public IP): Caddy (HTTPS) + web platforma + PostgreSQL
# Ishga tushirish:  cd deploy/vps && cp .env.example .env && nano .env && docker compose up -d --build
services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      HOME_WG_IP: ${HOME_WG_IP:-10.99.0.2}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  web:
    build: ../../web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mentarmoq:${POSTGRES_PASSWORD}@db:5432/mentarmoq
      CONTENT_DIR: /content
      HTTPS_ONLY: "true"
    volumes:
      # Butun repo (courses/, labs/, day-XX/) read-only. Kontent yangilash: git pull + Admin → "Qayta yuklash"
      - ../..:/content:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mentarmoq
      POSTGRES_USER: mentarmoq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentarmoq"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  pgdata:
